name: registrodoc

services:
  postgres:
    image: postgres:17
    container_name: registrodoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: registrodoc
      POSTGRES_USER: registrodoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - registrodoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registrodoc -d registrodoc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  identityhub:
    build:
      context: .
      dockerfile: src/RegistroDoc.IdentityHub/Dockerfile
    container_name: registrodoc-identityhub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityHub: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
      IDENTITY_ADMIN_EMAIL: ${IDENTITY_ADMIN_EMAIL:-}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8081:8080"

  api:
    build:
      context: .
      dockerfile: src/RegistroDoc.Api/Dockerfile
    container_name: registrodoc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      identityhub:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RegistroDoc: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Documents__RootPath: /data/input
    volumes:
      - ./data/input:/data/input:ro
    ports:
      - "127.0.0.1:8082:8080"

  sampledata:
    image: alpine:3.22
    container_name: registrodoc-sampledata
    restart: "no"
    volumes:
      - ./data/input:/data/input
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/input/2025 /data/input/2026
        rm -f /data/input/habilitacao-ficticia-2025-002.pdf /data/input/habilitacao-ficticia-2026-001.pdf
        printf '%s' '' | base64 -d > /data/input/2026/habilitacao-ficticia-2026-001.pdf
        printf '%s' '' | base64 -d > /data/input/2025/habilitacao-ficticia-2025-002.pdf
        for i in $(seq -w 3 23); do
          destino="/data/input/2026/habilitacao-ficticia-2026-$i.pdf"
          cp /data/input/2026/habilitacao-ficticia-2026-001.pdf "$destino"
          printf '\n%% REGISTRODOC PAGINACAO %s\n' "$i" >> "$destino"
        done
        echo "PDFs ficticios preparados: 23 documentos para validacao de pesquisa e paginacao."

  indexer2026:
    build:
      context: .
      dockerfile: src/RegistroDoc.Indexer/Dockerfile
    container_name: registrodoc-indexer-2026
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      sampledata:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RegistroDoc: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Indexer__InputPath: /data/input/2026
      Indexer__SearchPattern: "*.pdf"
      Indexer__IncludeSubdirectories: "false"
      Indexer__ScanIntervalSeconds: "5"
      Indexer__CodigoCnsServentia: TESTE0001
      Indexer__TipoDocumento: HabilitacaoCasamento
      Indexer__AnoReferencia: "2026"
      Indexer__ProcessingTimeoutMinutes: "30"
    volumes:
      - ./data/input:/data/input:ro

  indexer2025:
    build:
      context: .
      dockerfile: src/RegistroDoc.Indexer/Dockerfile
    container_name: registrodoc-indexer-2025
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      sampledata:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RegistroDoc: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Indexer__InputPath: /data/input/2025
      Indexer__SearchPattern: "*.pdf"
      Indexer__IncludeSubdirectories: "false"
      Indexer__ScanIntervalSeconds: "5"
      Indexer__CodigoCnsServentia: TESTE0001
      Indexer__TipoDocumento: HabilitacaoCasamento
      Indexer__AnoReferencia: "2025"
      Indexer__ProcessingTimeoutMinutes: "30"
    volumes:
      - ./data/input:/data/input:ro

  web:
    build:
      context: .
      dockerfile: src/RegistroDoc.Web/Dockerfile
    container_name: registrodoc-web
    restart: unless-stopped
    depends_on:
      - identityhub
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: "http://api:8080/"
      IdentityHub__BaseUrl: "http://identityhub:8080/"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  registrodoc_pgdata:
