name: registrodoc

services:
  postgres:
    image: postgres:17
    container_name: registrodoc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: registrodoc
      POSTGRES_USER: registrodoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - registrodoc_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registrodoc -d registrodoc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  registrodoc_pgdata:
