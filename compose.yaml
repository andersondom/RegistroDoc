name: registrodoc

services:
  postgres:
    image: postgres:17
    container_name: registrodoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: registrodoc
      POSTGRES_USER: registrodoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - registrodoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registrodoc -d registrodoc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  identityhub:
    build:
      context: .
      dockerfile: src/RegistroDoc.IdentityHub/Dockerfile
    container_name: registrodoc-identityhub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityHub: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
      IDENTITY_ADMIN_EMAIL: ${IDENTITY_ADMIN_EMAIL:-}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8081:8080"

  api:
    build:
      context: .
      dockerfile: src/RegistroDoc.Api/Dockerfile
    container_name: registrodoc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      identityhub:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RegistroDoc: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:8082:8080"

  indexer:
    build:
      context: .
      dockerfile: src/RegistroDoc.Indexer/Dockerfile
    container_name: registrodoc-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RegistroDoc: "Host=postgres;Port=5432;Database=registrodoc;Username=registrodoc;Password=${POSTGRES_PASSWORD}"
      Indexer__InputPath: /data/input
      Indexer__SearchPattern: "*.pdf"
      Indexer__IncludeSubdirectories: "true"
      Indexer__ScanIntervalSeconds: "5"
      Indexer__CodigoCnsServentia: TESTE0001
      Indexer__TipoDocumento: HabilitacaoCasamento
      Indexer__AnoReferencia: "2026"
      Indexer__ProcessingTimeoutMinutes: "30"
    volumes:
      - ./data/input:/data/input:ro

  web:
    build:
      context: .
      dockerfile: src/RegistroDoc.Web/Dockerfile
    container_name: registrodoc-web
    restart: unless-stopped
    depends_on:
      - identityhub
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: "http://api:8080/"
      IdentityHub__BaseUrl: "http://identityhub:8080/"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  registrodoc_pgdata:
